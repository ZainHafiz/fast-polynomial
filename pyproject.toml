[build-system]
requires = ["setuptools>=61.0", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "fast_polynomial"
version = "0.1"
description = "Immutable univariate polynomial with three multiplication algorithms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zain Hafiz" }
]

dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
